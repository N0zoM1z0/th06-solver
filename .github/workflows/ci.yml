name: Native contracts
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and i386 standard library
        run: sudo apt-get update && sudo apt-get install -y clang g++-multilib cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Test without private game data
        run: ctest --test-dir build --output-on-failure -j 1
